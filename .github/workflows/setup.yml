name: Local setup checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      LAB_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Expose the Windows runner's LLVM installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmBin = 'C:\Program Files\LLVM\bin'
          if (Test-Path "$llvmBin\clang.exe") {
            Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
          }
      - name: Run setup on Mac
        if: runner.os == 'macOS'
        run: bash setup-mac.sh
      - name: Run setup on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: setup-windows.bat
      - name: Check configuration and setup failure cases
        run: python -m unittest discover -s tests -v
